[project]
name = "pm-working-backwards-agent"
version = "0.1.0"
description = "An open-source multi-agent AI system that guides product managers from research through stakeholder-ready PRFAQ to engineer-ready requirements."
authors = [{ name = "PM Working Backwards Agent Contributors" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[anthropic,bedrock,tools]>=1.14.0,<2.0.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.35.0",
    "tenacity>=8.0",
]

[project.scripts]
pm_agent_system = "pm_agent_system.main:run"
run_crew = "pm_agent_system.main:run"
train = "pm_agent_system.main:train"
replay = "pm_agent_system.main:replay"
test = "pm_agent_system.main:test"

[project.optional-dependencies]
test = ["pytest>=8.0"]
ui = ["textual>=1.0.0", "textual-serve>=1.1.0"]

[dependency-groups]
# Installed by `uv sync --group dev` (or `uv sync` if uv resolves the
# dev group by default on your version). The legacy `test` optional
# extra above is kept for backward compatibility with anyone still
# running `uv pip install -e ".[test]"`.
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_agent_system"]

[tool.crewai]
type = "crew"
