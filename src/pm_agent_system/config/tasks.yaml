validate_input:
  description: >
    You are a senior product leader reviewing a junior PM's product brief before approving research budget.
    Your job is NOT to validate the idea. It is to pressure-test the PM's thinking.

    Read the PM's structured input carefully. Then ask exactly 5 questions, one at a time.
    These questions should be hard, specific, and grounded in what the PM actually wrote. Not generic.

    The 5 questions must cover:

    1. KILLER ASSUMPTION: "What is the single assumption in your brief that, if wrong, would make this entire initiative worthless? Name it specifically."

    2. ORGANIZATIONAL RESISTANCE: "Who in your organization will resist or deprioritize this, and what is their incentive for doing so? If you can't name a person, you haven't thought about this enough."

    3. EVIDENCE VS. INTUITION: "In your input, which claims are based on data you've actually seen, and which are based on your gut feeling? Be honest. Mark each one."

    4. PROBLEM VS. SYMPTOM: "Is the problem you described the actual root cause, or is it a symptom of something deeper? What would you find if you asked 'why' three more times?"

    5. FAILURE CONDITIONS: "Describe specifically what would need to be true for this initiative to fail. Not 'it might not work'. Name the concrete scenario."

    Present all 5 questions. Wait for the PM to respond via the human_input checkpoint.
    After the PM responds, summarize what you learned and note any red flags or gaps
    that the research phase should specifically investigate.

    Do NOT skip this step. Do NOT answer the questions yourself. Do NOT soften the questions.
    The PM's discomfort with a question is signal, not a problem.
  expected_output: >
    A brief summary (3-5 sentences) of the key assumptions, risks, and gaps identified
    during the challenge step, formatted as research directives for the next task.
    Example: "Research should specifically investigate whether [assumption X] holds in
    the target market. The PM acknowledged uncertainty about [Y]. Prioritize finding
    data on this. The organizational resistance from [role] around [concern] should be
    addressed in the PRFAQ's internal FAQ."
  agent: research_agent
  human_input: true

# ---------- Split research tasks (Stage 2 architecture) ----------
# These three tasks replace the monolithic research_task when using
# the split research crew. Each task has a focused tool set and a
# smaller output schema, preventing tool-skipping under load.

external_research_task:
  description: >
    You are gathering external market data for a PM's product research
    request. Focus ONLY on public market data and competitive analysis.
    Do NOT use the Dovetail tool. Do NOT synthesize or write strategic
    implications. Just gather external evidence.

    ## PM Input

    **Feature / Idea Summary:** {feature_summary}

    **Goals:** {goals}

    **User Summary:** {user_summary}

    **Known Constraints:** {known_constraints}

    ## Your Job

    1. **Market sizing.** Use the Tavily search tool to find real market
       sizing data with named sources and numbers. If data is unavailable,
       note it in external_gaps.

    2. **Competitive landscape.** Use Tavily to identify 3-5 competitors
       or comparable products. For each, use the competitive_intelligence
       tool to look up G2, Capterra, and TrustRadius review data. Include
       ratings, review counts, top pros, top cons, common reviewer roles,
       and pricing if available.

    3. **Return as ExternalResearchOutput JSON.** Include all sources in
       external_sources. Note any gaps in external_gaps.

    ## Rules

    - Every claim needs a real number AND a source.
    - Never fabricate statistics, URLs, or competitor names.
    - If fewer than 3 competitors found, report what you found and note
      the gap. Do not invent competitors.
    - No banned words: robust, comprehensive, powerful, cutting-edge,
      transformative, game-changing, revolutionary, best-in-class,
      seamless, incredibly, significantly, essentially, very, really,
      quite, extremely, strong, leverage, synergies, drive alignment,
      holistic, unlock, supercharge.

    If the builder_mcp tool is available, use it alongside Tavily to
    gather internal wiki pages, code search results, Taskei tickets,
    and Quip documents related to {feature_summary}. Include any
    internal findings in external_sources with an "[internal]" prefix.
    If builder_mcp returns an error or is not available, note the
    missing internal context in external_gaps and continue.

  expected_output: >
    An ExternalResearchOutput JSON object with market_sizing populated
    from real sources, competitors list with 3-5 entries including review
    data, external_sources listing all URLs cited, and external_gaps
    noting any topics where data was unavailable.

  agent: research_agent
  human_input: false

customer_evidence_task:
  description: >
    You are gathering internal customer research data from the Dovetail
    workspace. Focus ONLY on Dovetail. Do NOT use Tavily or competitive
    intelligence tools. Do NOT synthesize findings.

    ## PM Input

    **Feature / Idea Summary:** {feature_summary}

    **Goals:** {goals}

    **User Summary:** {user_summary}

    ## Your Job

    1. **Search Dovetail.** Call the dovetail_research tool with
       action='deep_search' and a keyword query related to the problem
       space (e.g., the core topic from feature_summary). This will
       search the workspace, find relevant projects, and fetch full
       insight content including direct customer quotes.

    2. **Run at least two deep_search calls** with different queries.
       For example, one for the core problem domain and one for the
       user persona or a specific pain point.

    3. **Extract quotes.** From the returned insight content, pull out
       direct customer quotes with attribution. Include the insight
       title and project name as the source.

    4. **Return as CustomerEvidenceOutput JSON.** If Dovetail returns
       no relevant content, populate dovetail_gaps with what was
       searched and what was missing. Do not fabricate quotes.

    ## Rules

    - Only use the dovetail_research tool. No other tools.
    - Direct quotes go in quotation marks with source attribution.
    - Never fabricate interview quotes or customer data.
    - If Dovetail returns nothing useful, say so in dovetail_gaps.

  expected_output: >
    A CustomerEvidenceOutput JSON object with customer_evidence
    populated from real Dovetail insight content (direct quotes with
    source and theme), dovetail_sources listing the projects and
    insights referenced, and dovetail_gaps noting any topics where
    Dovetail had no relevant content.

  agent: research_agent
  human_input: false

research_synthesis_task:
  description: >
    You have two completed research outputs from prior tasks:
    1. ExternalResearchOutput (market sizing + competitive landscape)
    2. CustomerEvidenceOutput (Dovetail customer quotes)

    Your job is to merge these into a single ResearchOutput that the
    PRFAQ agent can consume. You have NO tools. Do not search for
    anything new. Work only from the data in the prior task outputs
    and the PM's input below.

    ## PM Input

    **Feature / Idea Summary:** {feature_summary}

    **Goals:** {goals}

    **Timing:** {timing}

    **User Summary:** {user_summary}

    **Success Metrics:** {success_metrics}

    **Known Constraints:** {known_constraints}

    **Internal Context:** {internal_context}

    **Business Context:** {business_context}

    ## Your Job

    1. **Context.** Write 1-3 sentences restating the problem from the
       PM's input. No citations needed.

    2. **Executive summary.** Summarize the top findings from both the
       external research and customer evidence. Reference business
       context metrics if provided.

    3. **Market sizing.** Copy directly from ExternalResearchOutput.

    4. **Competitors.** Copy directly from ExternalResearchOutput.

    5. **Customer evidence.** Copy directly from CustomerEvidenceOutput.

    6. **Pain points.** Derive from both external and customer evidence.
       Rank by severity. Cite sources.

    7. **Internal state assessment.** If internal_context was provided,
       summarize it. If not, note it was not provided.

    8. **Strategic implications.** Factual summary of what the combined
       data suggests. No recommendations. Tie each implication to a
       cited finding.

    9. **Gaps and limitations.** Merge external_gaps and dovetail_gaps
       from the prior outputs. Add any additional gaps you notice.

    10. **Sources.** Merge external_sources and dovetail_sources.

    11. **Return as ResearchOutput JSON.**

    ## Rules

    - Do NOT call any tools. You have none.
    - Do NOT invent data. Only use what the prior tasks produced.
    - Preserve inline citations from the prior outputs.
    - No banned words (same list as other tasks).
    - If business_context was provided, reference it in the executive
      summary and strategic implications.

    If the ExternalResearchOutput contains internal findings from the
    builder_mcp tool (entries prefixed with "[internal]"), carry them
    into the merged ResearchOutput. Place internal findings in the
    internal state assessment section alongside any PM-provided
    internal_context. Do not discard internal evidence during merging.

  expected_output: >
    A ResearchOutput JSON object with all fields populated by merging
    the ExternalResearchOutput and CustomerEvidenceOutput from prior
    tasks, plus PM input for context, internal state, and business
    context sections.

  agent: research_agent
  human_input: true

# ---------- Original monolithic research task (kept as fallback) ----------

research_task:
  description: >
    You have been given a product research request from a PM. Your job is to
    gather comprehensive evidence from all available sources and produce a
    structured research brief.

    ## PM Input

    **Feature / Idea Summary:** {feature_summary}

    **Goals:** {goals}

    **Timing:** {timing}

    **User Summary:** {user_summary}

    **Success Metrics:** {success_metrics}

    **Known Constraints:** {known_constraints}

    **Internal Context:** {internal_context}

    **Business Context:** {business_context}

    ## Research Process

    1. **Validate inputs.** Confirm that Feature Summary, Goals, Timing, and
       User Summary are present and specific enough to act on. If any are
       missing or too vague, stop and ask the PM to fill in the gaps. If
       Success Metrics, Known Constraints, or Internal Context are missing,
       note it but proceed.

    2. **External research.** Use the Tavily search tool to find:
       - Market sizing data (real numbers, named sources)
       - 3-5 competitors or comparable products at the relevant scale
       - Public customer quotes from reviews, forums, or analyst reports
       - Industry benchmarks with attribution

       For each competitor identified, use the competitive_intelligence
       tool to look up user review data from G2, Capterra, and
       TrustRadius. Include the following in each competitor analysis:
       - Overall ratings and review counts from review platforms
       - Top pros and cons as reported by actual users (not marketing copy)
       - Common reviewer roles (helps validate whether reviewers match
         the target persona)
       - Pricing summary if available

       This review data supplements your web research. It represents
       what real users actually think, not what the company claims.
       When strengths or weaknesses from reviews contradict the
       company's own positioning, note the discrepancy.

       If a competitor has few or no reviews on these platforms, note
       the limited data and rely on web research for that competitor's
       analysis.

    3. **Customer evidence.** Use the Dovetail research tool with
       action='deep_search' and a keyword query related to the problem
       space. This will automatically search the workspace, find relevant
       projects, and fetch the full content of published insights
       including direct customer quotes. Run at least two deep_search
       calls with different queries (e.g., one for the core problem,
       one for the user persona). Extract direct quotes, quantified
       metrics, and attributed findings from the returned insight
       content. If you need more detail on a specific insight, use
       action='insight_content' with the insight_id.

    4. **Internal context.** If the PM provided internal context file paths,
       use the file reader tool to read those documents and extract relevant
       technical state, constraints, or prior decisions.

    5. **Synthesize findings** into the output structure below. Do NOT
       interpret or recommend. Organize the evidence factually. Flag gaps
       honestly.

    6. **Business context.** If the PM provided a `business_context` field,
       use it to contextualize your research findings. Current-state metrics
       (churn, conversion, adoption, support volume) should be compared
       against what the research finds. Are the PM's numbers above or below
       industry benchmarks? Does the business context change which findings
       are most urgent? A rising churn rate makes retention-related findings
       more critical. Declining adoption makes onboarding-related findings
       more critical. Reference the business context data in the Executive
       Summary and Strategic Implications sections. If no business_context
       is provided, note in the Gaps and Limitations section that current
       business metrics were not provided and findings are based on external
       research only.

    ## Writing Rules (Hard Constraints)

    Every fact must be cited inline with a markdown link in the format
    `[source name](url)` placed immediately after the claim. Do NOT defer
    citations to a sources section only. The Sources section at the bottom
    is a duplicate index, not the primary citation.

    ## Output Format

    Return your findings as a JSON object matching the ResearchOutput schema
    enforced by the task. Every text field (context, executive_summary,
    strategic_implications, competitor descriptions, customer quotes, etc.)
    must follow the writing rules below. Inline `[source name](url)`
    citations belong inside the text fields wherever a factual claim is
    made — Pydantic does not strip them.

    Banned words and phrases (do not use any of these):
    robust, comprehensive, powerful, cutting-edge, transformative,
    game-changing, revolutionary, best-in-class, seamless, incredibly,
    significantly, essentially, very, really, quite, extremely, strong,
    leverage, synergies, drive alignment, holistic, unlock, supercharge.

    Sentence rules:
    - No em dashes. Restructure instead.
    - No contrast hooks ("It's not X, it's Y" / "This isn't about X").
    - No filler transitions ("In today's landscape", "It's worth noting").
    - Lead with the claim. Follow with the evidence.
    - Vary sentence length. Short sentences for emphasis.
    - Active voice by default.

    Evidence rules:
    - Every impact claim needs a real number AND a source.
    - "Strong market opportunity" is banned. "$30.32B in 2026, 17.9% CAGR
      ([Coherent Market Insights](url))" is correct.
    - If you don't have a number, say so in Gaps and Limitations.
    - Direct customer quotes go in quotation marks with the source.

    Anti-hallucination rules:
    - If a Tavily search returns no results for a topic, do NOT invent
      data. Remove the claim and add the topic to gaps_and_limitations.
    - Never fabricate a statistic, customer quote, or source URL.
    - Never generate a URL that you did not receive from a tool response.
    - If you have fewer than 3 competitors after searching, report what
      you found and note the gap. Do not invent competitors.
    - If Dovetail returns no results or is unavailable, note "No internal
      customer research data was available from Dovetail" in the
      customer_evidence section and add it to gaps_and_limitations.
      Do not fabricate interview quotes.

  expected_output: >
    A markdown document with the following sections. Every factual claim
    must include an inline `[source](url)` citation.

    # Research Brief: [Feature/Idea Name]

    ## 1. Context
    1-3 sentences restating the problem based on PM input. No citations
    needed here since this is the PM's own framing.

    ## 2. Key Findings
    Bulleted summary of the most important findings. Every bullet that
    makes a factual claim must cite its source inline.

    ## 3. Detailed Findings

    ### 3a. Market Sizing
    Real numbers with inline citations. If a number isn't available, say
    so and move it to Gaps.

    ### 3b. Competitive Landscape
    3-5 competitors. For each: name, positioning, features, pricing (if
    public), and source link. Group by tier (enterprise, mid-market, etc.)
    if relevant.

    ### 3c. Customer Evidence
    Direct quotes from Dovetail and public sources. Each quote in
    quotation marks with attribution and link.

    ### 3d. Pain Point Summary
    Pain points ranked by frequency or severity, with the evidence that
    supports the ranking cited inline.

    ### 3e. Internal State Assessment
    Summary of relevant internal docs if provided. If none provided,
    write: "No internal context was provided for this request."

    ## 4. Strategic Implications
    Factual summary of what the data points to. No recommendations.
    Every implication tied to a cited finding above.

    ## 5. Gaps and Limitations
    What couldn't be found. What sources were unavailable. What
    assumptions remain unvalidated.

    ## 6. Sources
    Full list of sources by type, with URLs. This is an index, not the
    primary citation mechanism.

  agent: research_agent
  human_input: true

generate_prfaq:
  description: >
    You have an approved ResearchOutput from the Research Agent and the PM's
    original structured input. Your job is to produce a complete PRFAQ v1.0
    (Working Backwards document) that a VP could approve.

    ## PM Input

    **Feature / Idea Summary:** {feature_summary}

    **Goals:** {goals}

    **Timing:** {timing}

    **User Summary:** {user_summary}

    **Success Metrics:** {success_metrics}

    **Known Constraints:** {known_constraints}

    **Internal Context:** {internal_context}

    **Business Context:** {business_context}

    ## Process

    1. **Load the style guide first.** Call the style_guide_loader tool
       before drafting anything. Apply its rules in addition to the rules
       in your backstory.

    2. **Read the ResearchOutput from prior task context.** Use it as the
       single source of truth for facts. Every claim in the PRFAQ must
       trace back to a research finding or be flagged as an assumption.

    3. **Honor the gaps.** If the ResearchOutput's gaps_and_limitations
       list is non-empty, you MUST reference those gaps honestly in the
       internal FAQ risk question and in the appendix_gaps. Do not write
       around them. Do not pretend they don't exist.

    3a. **Do not fabricate.** If the research brief has fewer than 3
       competitors, do not invent additional ones for the competitor
       table. If no customer quotes exist in the research, the fictional
       customer quote in the press release must be explicitly labeled:
       "[Illustrative quote — replace with real customer feedback before
       stakeholder review]". If the research has significant gaps, the
       internal FAQ must include a question about what remains unvalidated
       and what the plan is to close those gaps before committing
       engineering resources.

    4. **Use business context.** If business_context was provided in the
       original input, reference it in the Internal FAQ section when
       answering "Why now?" and "What's the expected impact?" Ground the
       answers in real current-state numbers, not just aspirational targets
       from the Goals field. The difference between current state
       (business_context) and target state (Goals/Success Metrics) IS the
       impact story.

    5. **Draft the PRFAQ** in the structure below.

    6. **Enumerate data handling.** For every product interaction described
       in the press release or the customer experience narrative, identify
       each data element the product will collect, process, store, or
       transmit. For each element, produce a PRFAQDataElement with these
       fields:

       - `name`: a short label for the element (for example, "User email",
         "Session token", "Payload metadata").
       - `classification`: exactly one of the five Data_Classification
         values:
           - Public. Information intended for public availability with
             no restriction on disclosure.
           - Confidential. General non-public information that requires
             access control but has limited harm potential if disclosed.
           - Highly Confidential. Non-public information whose disclosure
             would cause notable harm to customers or the business.
           - Restricted. Information whose disclosure would cause severe
             harm or trigger regulatory or contractual exposure.
           - Critical. Information whose disclosure or loss would cause
             the highest severity impact, including legal, financial, or
             safety consequences.
       - `purpose`: one short phrase describing why the product handles
         this element.

       Populate these elements into `data_handling.elements`. Set
       `data_handling.gap_flag` to False.

       If the PM input and PRFAQ content contain NO information about
       data handling, DO NOT fabricate elements. Instead:
         - Set `data_handling.gap_flag = True`.
         - Add an entry to `data_handling.gap_notes` naming what was
           missing (for example, "PM input did not describe data
           handling; BRD compliance task should flag this for stakeholder
           follow-up").
         - Leave `data_handling.elements` empty.
         - Add a corresponding entry to `appendix_gaps` so the gap is
           surfaced in the PRFAQ reviewer flow.

       Ground every element in the press release, the customer experience
       narrative, or the PM input. Do not fabricate data handling to
       cover research gaps.

    7. **Return as a JSON object matching the PRFAQOutput schema.** Inline
       `[source name](url)` citations belong inside text fields wherever a
       factual claim is made. Pydantic does not strip them.

    If the outlook_mcp tool is available, use it to look up stakeholder
    calendar data and scheduling context. Include relevant scheduling
    findings in the Internal FAQ section when answering questions about
    timeline, resourcing, or stakeholder availability. If the outlook_mcp
    tool is not available, proceed without scheduling data.

    ## PRFAQ Structure

    ### 1. Press Release (300-500 words)
    Future-state announcement, written as if the product has already
    launched. Dateline at the top. Include:
    - Headline (clear, no hyperbole)
    - Subheadline (one sentence on the customer benefit)
    - Opening paragraph: who it's for, what it does, why it matters
    - 2-3 paragraphs of detail with real evidence
    - One fictional customer quote, attributed to a fictional but realistic
      person, grounded in the real customer evidence from research
    - Closing call to action

    ### 2. External FAQs (minimum 3, customer-facing)
    Questions a customer would actually ask. Plain language. Each answer
    cites evidence where applicable.

    ### 3. Internal FAQs (minimum 5, stakeholder-facing)
    Questions a VP, eng lead, designer, or finance partner would ask.
    MUST include:
    - A strategy question answered using the Good Strategy / Bad Strategy
      framework: diagnosis (what's the situation), guiding policy (what
      approach), coherent actions (what specific steps).
    - A risk question that surfaces real risks and gaps from the research,
      not sanitized ones.
    - A "what could go wrong" or "what would make us kill this" answer.

    ### 4. Customer Experience Narrative (1-2 pages)
    End-to-end user experience story. Present tense. Third person. Specific
    enough that a designer could sketch from it. Walk through the customer's
    actual flow from trigger through outcome. Name the screens, the
    decisions, the moments of friction or delight. No vague language.

    ### 5. Appendices
    - **appendix_data_points:** Key facts and metrics from research, each
      with inline `[source](url)` citation.
    - **appendix_competitor_table:** Each competitor as a dict with at
      least: name, positioning, key_features, pricing (if known), source.
      When building the appendix_competitor_table, include review
      platform ratings if available in the research output. For each
      competitor, check if review_data exists and add these keys to the
      competitor dict:
      - "G2 Rating": the rating string from G2 (e.g., "4.7/5 (5,200+
        reviews)") — or leave blank if no G2 data
      - "Capterra Rating": the rating string from Capterra — or leave
        blank if no Capterra data
      These columns help stakeholders see real user sentiment alongside
      feature comparisons.
    - **appendix_customer_quotes:** Direct quotes from research, preserved
      with attribution and source.
    - **appendix_gaps:** Open questions, unvalidated assumptions, anything
      the research couldn't answer.

    ### 6. Version History
    Start with one entry: version "1.0", today's date, author "Agent 2",
    changes "Initial draft generated from approved research."

  expected_output: >
    A PRFAQOutput JSON object with all required fields populated. Inline
    citations preserved inside text fields. Press release is 300-500 words.
    External FAQs >= 3. Internal FAQs >= 5 and include the strategy
    question and the risk question. Customer experience narrative is
    specific and concrete. Version history starts at 1.0.

  agent: prfaq_agent
  human_input: true
  context:
    - research_task

revise_prfaq:
  description: >
    You are revising an existing PRFAQ based on stakeholder feedback. This
    task does NOT depend on the Research Agent — work only from the inputs
    below.

    ## Inputs

    **Current PRFAQ file path:** {prfaq_path}

    **Revision context (file path, may be empty):** {context_path}

    **Revision context (inline text, may be empty):** {context_text}

    ## Process

    1. **Load the style guide first.** Call style_guide_loader before
       drafting anything.

    2. **Read the current PRFAQ** from prfaq_path using the file_reader
       tool. Parse the structure and existing version history.

    3. **Read revision context.** If context_path is set, use file_reader
       to load it (it may point to a file or a folder of files). If
       context_text is set, use it as-is. Combine both if both are present.

    4. **Pause and ask the PM** which sections need revision. Use the
       human_input checkpoint to confirm scope before rewriting. Do not
       assume. The valid sections are: press_release, external_faqs,
       internal_faqs, customer_experience_narrative, appendix_data_points,
       appendix_competitor_table, appendix_customer_quotes, appendix_gaps.

    5. **Update ONLY the sections the PM identified.** Preserve every
       other section exactly as it appeared in v1.0 (or whatever the
       current version is). Do not "improve" untouched sections.

       If the appendix_competitor_table is being revised and the
       research output included review_data for competitors, add
       "G2 Rating" and "Capterra Rating" keys to each competitor dict
       (e.g., "4.7/5 (5,200+ reviews)"). Leave blank if no data exists
       for that platform.

    6. **Maintain inline citations** from the original where they still
       apply. If revision context contradicts a cited claim, flag the
       contradiction in the internal FAQ rather than silently overwriting.

    7. **Append a new version history entry.** Bump the version (1.0 -> 1.1,
       1.1 -> 1.2, etc.). Use today's date. Author "Agent 2". Changes
       field should describe what was revised and why, in one or two
       sentences.

    8. **Return the full PRFAQOutput JSON object** with all sections —
       updated and preserved alike. The output is always a complete
       document, not a diff.

  expected_output: >
    A PRFAQOutput JSON object containing the full revised PRFAQ. Only the
    PM-approved sections show new content; all other sections match the
    input PRFAQ verbatim. Version history has one new entry at the end
    with the bumped version number.

  agent: prfaq_agent
  human_input: true

generate_design_brief:
  description: >
    You have an approved PRFAQ and a research brief. Produce a
    DesignBriefOutput that maps the product's customer experience to
    concrete screens, user flows, and design decisions.

    ## Inputs

    **Feature / Idea Summary:** {feature_summary}

    **Target Users:** {user_summary}

    **Known Constraints:** {known_constraints}

    **Approved PRFAQ file path:** {prfaq_path}

    **Research brief file path (may be empty if unavailable):** {research_path}

    **Visual style guide path (may be empty):** {visual_style_guide_path}

    ## Process

    1. **Read the approved PRFAQ** from {prfaq_path} using the file_reader
       tool. The customer experience narrative is your primary source for
       screen inventory and user flows.

    2. **If {research_path} is non-empty, read it** using file_reader. The
       competitive landscape section is your source for competitive UI
       patterns. Reference competitors by name.

    3. **Style guide handling.**
       - If {visual_style_guide_path} is non-empty, read that file using
         the file_reader tool. Apply its colors, typography, spacing, and
         component preferences throughout the brief. Reference specific
         style guide sections in the Brand / Style Context output. Set
         style_guide_used=True in the output.
       - If {visual_style_guide_path} is empty OR the file cannot be
         read, use sensible defaults (neutral palette, system fonts).
         In the Brand / Style Context section, note that providing a
         style guide would improve brand accuracy. Set
         style_guide_used=False.

    4. **Extract screen inventory.** Walk the customer experience
       narrative paragraph by paragraph. Every named interaction, every
       decision point, every system response becomes a candidate screen.
       Produce at least 2 ScreenEntry items. For each screen:
       - name: Proper noun (Dashboard, Event Detail, Onboarding Welcome)
       - purpose: One sentence on why this screen exists
       - primary_flow: Which user flow this screen primarily serves
       - source_section: Specific PRFAQ section reference (e.g. "CX
         narrative, onboarding paragraph 2"). No vague references.

    5. **Define user flows.** Produce at least 1 DesignUserFlow. Typical
       products have three: an onboarding flow, a core flow (the main
       thing the product does), and one or more secondary flows. Each
       flow has:
       - name: e.g. "Core — Find and Track a Show"
       - priority: "core" | "onboarding" | "secondary"
       - steps: ordered DesignFlowStep list, each with step_number,
         user_action, system_response, and screen. Every screen
         referenced must exist in screen_inventory.
       - related_screens: the screens this flow touches.

    6. **Derive design principles.** Produce 3-5 principles specific to
       THIS product. Each principle is one sentence that a designer could
       use to break a tie when making a concrete design decision.
       "Minimize clicks" is banned. "Support one-handed phone use
       during a live event where the user may be standing" is correct.

    7. **Write competitive UI patterns.** Reference each competitor named
       in the research brief. For each, note a specific UI pattern worth
       matching or specifically avoiding. Do not invent competitors.

    8. **Brand / Style Context.** Describe the visual direction: palette,
       typography, component preferences. If a style guide was loaded,
       reference its sections. If not, describe sensible defaults and
       flag that a style guide would sharpen this section.

    9. **Accessibility.** If known_constraints or the style guide mention
       WCAG, keyboard navigation, screen readers, or contrast
       requirements, describe where those affect design decisions. If
       nothing is specified, write a one-line default ("target WCAG AA
       contrast; all interactive elements reachable via keyboard").

    10. **Platform targets.** Extract from known_constraints. If the PM
        said "web first, mobile later", platform_targets should be
        ["web", "mobile"] with order reflecting priority. If no platform
        constraint is stated, leave empty.

    11. **Return as a JSON object matching DesignBriefOutput.**

    ## Writing Rules (Hard Constraints)

    - No hyperbole. Banned words: "delightful", "seamless", "intuitive",
      "powerful", "best-in-class", "robust", "comprehensive".
    - No em dashes. Restructure the sentence.
    - Every screen name is a proper noun.
    - Every flow step reads: user does X → system responds with Y on
      screen Z.
    - Every screen has a source_section. No vague references.
    - Never invent competitors. Only reference competitors named in the
      research brief.

  expected_output: >
    A DesignBriefOutput JSON object with all required fields populated.
    screen_inventory >= 2 entries, each with a specific source_section.
    user_flows >= 1, each with ordered steps referencing screens from
    the inventory. design_principles >= 3 and <= 5, specific to this
    product. competitive_ui_patterns references named competitors from
    the research brief. brand_style_context reflects whether a style
    guide was loaded. style_guide_used is set to True or False
    consistent with whether a style guide was applied.

  agent: design_brief_agent
  human_input: true

revise_design_brief:
  description: >
    You are revising an existing design brief based on PM feedback.
    This task is independent of the PRFAQ and research tasks.

    ## Inputs

    **Current design brief file path:** {design_brief_path}

    **Revision context (file path, may be empty):** {context_path}

    **Revision context (inline text, may be empty):** {context_text}

    ## Process

    1. **Read the current design brief** from {design_brief_path} using
       the file_reader tool. Parse the structure.

    2. **Read revision context.** If {context_path} is set, use
       file_reader to load it. If {context_text} is set, use it as-is.
       Combine both if both are present.

    3. **Pause and ask the PM** which sections need revision via the
       human_input checkpoint. Valid sections: product_overview,
       screen_inventory, user_flows, design_principles,
       competitive_ui_patterns, brand_style_context,
       accessibility_considerations, platform_targets.

    4. **Update ONLY the sections the PM identified.** Preserve every
       other section exactly as-is. Do not "improve" untouched sections.

    5. **Preserve traceability.** If you revise screen_inventory, every
       updated ScreenEntry still has a source_section. If you revise
       user_flows, referenced screens still exist in the inventory.

    6. **Return the full DesignBriefOutput JSON object** with all
       sections — updated and preserved alike.

  expected_output: >
    A DesignBriefOutput JSON object containing the full revised design
    brief. Only the PM-approved sections show new content; all other
    sections match the input verbatim.

  agent: design_brief_agent
  human_input: true

generate_wireframes:
  description: >
    Generate SVG wireframes from the approved design brief. [NOT YET
