generate_brd_chained:
  description: >
    Produce a complete BRD v1.0 that an engineer can build from without
    scheduling a clarification meeting. Use the approved PRFAQ and
    research from the prior tasks in this pipeline.

    ## Process

    1. **Load the style guide** via style_guide_loader before drafting
       the prose sections (executive summary, problem statement, technical
       context). Apply its rules.

    2. **Use the prior task context.** The ResearchOutput and PRFAQOutput
       from the upstream tasks are the source of truth. Every claim and
       every requirement must trace back to the PRFAQ, the research, or
       the PM's known constraints.

    2a. **Use the competitive analysis from the research brief.** Read
       the competitive analysis section of the research brief. Reference
       each named competitor by name in the solution rationale section.
       Identify at least one point of differentiation for each named
       competitor: something we do that they do not, or something they
       do that we must match. In the proposed solution overview and
       problem statement sections, cite each competitor by name rather
       than referring to "competitors" generically. If the research
       identified strengths or weaknesses from user reviews, reference
       those in the solution rationale to explain why the proposed
       approach is better or where it must reach parity.

    3. **Apply the AWS-first rule.** All architecture references default
       to AWS services (Lambda, DynamoDB, Cognito, API Gateway, S3,
       CloudFront, SNS/SQS/EventBridge, Bedrock). Do not reference
       Supabase, Firebase, Vercel, or other non-enterprise services
       unless the PM's constraints explicitly require them.

    4. **Use Tavily and AWS Pricing API** to find reference URLs and
       exact pricing for cost-flagged decisions. When flagging
       cost-relevant decisions, use the aws_pricing_lookup tool to get
       exact current pricing for each AWS service involved in the
       decision. Include the specific per-unit price in the cost flag
       rather than vague language like "may be expensive."

       Example of a GOOD cost flag with pricing data:
       - Decision: DynamoDB on-demand mode vs. provisioned capacity
       - Why it matters: On-demand costs $1.25/million write request
         units vs. provisioned at $0.00065/WCU-hour. At 10M
         writes/month, on-demand costs ~$12.50/month while provisioned
         (sized for peak) could cost less but requires capacity planning.
       - Tradeoff: On-demand is simpler (no capacity planning) but more
         expensive at scale. Provisioned is cheaper at predictable load
         but risks throttling during spikes.
       - Reference: AWS DynamoDB Pricing
         (https://aws.amazon.com/dynamodb/pricing/)

       When looking up pricing, use the product_family parameter to
       narrow results for large services. For example, use
       product_family="Serverless" for Lambda on-demand pricing, or
       product_family="Compute Instance" for EC2 instance pricing.
       This avoids overwhelming the cost flag with irrelevant pricing
       dimensions.

       If the aws_pricing_lookup tool fails or returns unexpected
       results, fall back to the tavily_search tool to find pricing
       info, and note that pricing should be verified on the AWS
       pricing page. Store the raw pricing summary from
       aws_pricing_lookup in the pricing_data field of each CostFlag
       for traceability.

    5. **Honor research gaps.** If the ResearchOutput's
       gaps_and_limitations is non-empty OR the PRFAQ's appendix_gaps is
       non-empty, surface them in the risk section. Do not paper over them.

    6. **Use business context.** If business_context was provided in the
       original input, reference it in the Success Metrics section as
       baseline values. Each success metric should show: current state
       (from business_context) → target state (from Success Metrics input)
       → measurement method. This makes the BRD's success criteria
       measurable against a real starting point.

    7. **Enforce traceability.** Every functional requirement must
       reference at least one user story ID. Every user story must
       reference a research finding or PRFAQ section in its source field.

    7a. **Design brief handling (conditional).** If {design_brief_path}
       is non-empty, use file_reader to read the design brief. Then:
       1. Reference specific screens by name when writing user stories
          (e.g., "As a user on the Dashboard screen, I want to...").
       2. Validate that your user stories cover every flow step listed
          in the design brief's user flows — every flow step should map
          to at least one user story.
       3. Carry screen names into the BRD's functional requirement
          descriptions for consistency with the design.
       4. Reference design principles from the brief in your solution
          rationale where relevant.
       If {design_brief_path} is empty, proceed without design context
       and do not reference screen names or flows.

    8. **Return as a JSON object matching the BRDOutput schema.**

    ## BRD Structure (12 sections)

    1. **Executive summary** — 3-5 sentences: what we're building, who
       for, and the expected outcome.
    2. **Problem statement** — what's broken, who it affects, evidence.
    3. **Proposed solution overview** — high-level approach. MUST include
       a Mermaid architecture diagram inline as a fenced ```mermaid block.
       The diagram should have 5-15 nodes. If the system is more complex,
       use a high-level diagram here and add a detailed breakdown in the
       technical context section.
    4. **User stories** — minimum 3. Each has ID (US-001), persona,
       action, outcome, priority (P0/P1/P2), and source.
    5. **Functional requirements** — minimum 3. Each has ID (FR-001),
       "The system shall..." description, rationale, given/when/then
       acceptance criteria, related user story IDs, and code samples
       (API contracts as JSON, data model schemas, integration snippets)
       where they help an engineer understand the requirement.
    6. **Non-functional requirements** — minimum 2. Categories:
       performance, security, scalability, accessibility, compliance.
       Quantified targets only. "Fast" is banned; "p95 latency < 200ms"
       is correct.
    7. **Technical context and dependencies** — current state. MUST
       include a Mermaid diagram of the existing system inline. Keep it
       to 5-15 nodes showing the major components and their relationships.
    8. **Cost flags** — architectural decisions with cost implications.
       Each flag: decision, why_it_matters, tradeoff, reference_url
       (from Tavily). No dollar amounts.
    9. **Risks** — minimum 2. Each has description, likelihood
       (high/medium/low), impact, and mitigation. Items from research
       gaps go here.
    10. **Success metrics** — minimum 1. Each has metric, target_value,
        measurement_method (e.g., "CloudWatch custom metric"), timeline.
    11. **Timeline and milestones** — high-level phases.
    12. **Version history** — start with v1.0, today's date, author
        "Agent 4", changes "Initial draft generated from approved PRFAQ."

    ## Customer Requirements Handling (when requirements file is provided)

    If the PM provides a customer requirements file via --requirements-path
    (passed as {requirements_path}), use the requirements_reader tool to
    parse it. These pre-existing requirements represent what the PM has
    already gathered from customers, interviews, or an existing backlog.

    Your job is to RECONCILE these requirements with the PRFAQ, not blindly
    include them:

    1. KEEP requirements that align with the approved PRFAQ. Carry forward
       the PM's exact title and description wording. Preserve their priority
       (P0-P4). Assign a user story ID (US-xxx) or functional requirement
       ID (FR-xxx) as appropriate.

    2. FLAG requirements that contradict the PRFAQ or have no traceability
       to the research. Present these to the PM during human review with a
       clear note: "[CR-xxx] does not appear in the approved PRFAQ or
       research output. Recommend confirming with stakeholders before
       including in the BRD."

    3. FILL GAPS — identify requirements implied by the PRFAQ customer
       experience narrative or internal FAQ answers that the PM's
       requirements file does not cover. Generate these as new requirements,
       clearly marked with origin: "agent-generated" and traceability: "PRFAQ section X"
       so the PM can distinguish them from their own inputs.

    4. DO NOT override the PM's priority assignments. If a PM marked
       something P0, it stays P0 even if the research suggests it's less
       critical. The PM owns prioritization. If you disagree, note it in
       the requirement's rationale field but do not change the priority.

    5. In the BRD output, every user story and functional requirement should
       have an `origin` field indicating whether it came from
       "customer_input" (the PM's file), "agent-generated" (derived from
       PRFAQ/research), or "reconciled" (PM's requirement that was modified
       to align with PRFAQ). Use the `traceability` field to reference the
       specific PRFAQ section, research finding, or PM constraint (e.g.
       "PRFAQ FAQ #3", "CR-005 (PM input)").

    If NO requirements file is provided (requirements_path is empty),
    generate all user stories and functional requirements from the PRFAQ
    and research as you do today. This feature is purely additive.

  expected_output: >
    A BRDOutput JSON object with all required fields populated. User
    stories >= 3 with traceability. Functional requirements >= 3 with
    code samples where useful. NFRs >= 2 with quantified targets. At
    least one Mermaid diagram each in proposed_solution_overview and
    technical_context_and_dependencies. Cost flags include real
    reference URLs. Risks >= 2. Version history starts at 1.0.
    If a requirements file was provided, user stories and functional
    requirements include source fields indicating origin (customer_input,
    agent-generated, or reconciled).

  agent: brd_agent
  human_input: true
  context:
    - research_task
    - generate_prfaq

revise_brd:
  description: >
    Revise specific sections of an existing BRD based on stakeholder
    feedback. This task is independent of Agents 1 and 2.

    ## Inputs

    **Current BRD file path:** {brd_path}

    **Revision context (file path, may be empty):** {context_path}

    **Revision context (inline text, may be empty):** {context_text}

    ## Process

    1. **Load the style guide** via style_guide_loader.
    2. **Read the current BRD** from brd_path using file_reader. Parse
       the structure and current version history.
    3. **Read revision context** from context_path (if set) and/or
       context_text (if set).
    4. **Pause and ask the PM** which sections need revision via the
       human_input checkpoint. Valid sections: executive_summary,
       problem_statement, proposed_solution_overview, user_stories,
       functional_requirements, non_functional_requirements,
       technical_context_and_dependencies, cost_flags, risks,
       success_metrics, timeline_and_milestones.
    5. **Update ONLY the sections the PM identified.** Preserve everything
       else exactly as-is. Do not "improve" untouched sections.
    6. **Maintain AWS-first defaults** and traceability rules in any
       new content.
    7. **Append a new version history entry.** Bump the version
       (1.0 -> 1.1, etc.). Today's date. Author "Agent 4". Changes field
       summarizes what was revised and why in 1-2 sentences.
    8. **Return the full BRDOutput** with all sections — updated and
       preserved alike.

  expected_output: >
    A BRDOutput JSON object containing the full revised BRD. Only the
    PM-approved sections show new content; all other sections match the
    input BRD verbatim. Version history has one new appended entry with
    the bumped version number.

  agent: brd_agent
  human_input: true

generate_build_spec_chained:
  description: >
    Produce a build spec from the approved BRD, formatted for the PM's
    chosen coding tool. The BRDOutput is available in your prior task
    context — use it directly.

    ## Inputs

    **Target tool:** {target_tool}

    Valid target tools: kiro, claude_code, cursor, lovable.

    ## Process

    1. **Load the style guide** via style_guide_loader for any prose.
    2. **Use the BRDOutput from prior task context** as the source of truth.
    3. **Carry acceptance criteria forward EXACTLY.** Do not paraphrase,
       summarize, or reword them. Copy them character-for-character from
       the BRD's functional requirements into the feature_specs.
    4. **Carry forward code samples** from the BRD as implementation
       guidance.
    5. **Identify out-of-scope items.** P2 items from the BRD and
       anything from known constraints that limits the build go here.
       The coding tool MUST NOT build these.
    6. **Format the formatted_spec field** for the chosen target tool.

    ## Build Spec Structure

    1. **build_summary** — 2-3 sentences: what to build, for whom, done condition.
    2. **user_flows** — minimum 1. Each has name, ordered steps, related FR-### IDs.
    3. **feature_specs** — minimum 1. Each has name, description,
       acceptance_criteria (EXACT from BRD), priority, code_samples.
    4. **technical_constraints** — AWS-specific constraints.
    5. **architecture_reference** — Mermaid diagram + description from BRD.
    6. **current_state_context** — relevant excerpts from BRD's technical context.
    7. **out_of_scope** — explicit list of P2 items and constraint exclusions.
    8. **target_tool** — the chosen tool name.
    9. **formatted_spec** — the complete tool-ready output. See below.

    ## Tool-specific formatting rules for formatted_spec

    - **kiro**: Format as a Kiro-compatible spec with three sections:
      Requirements (use EARS notation if natural — "WHEN <trigger> THE
      SYSTEM SHALL <response>"), Design (architecture, data models,
      sequence diagrams), and Tasks (implementation steps). Kiro will
      generate its own design doc from this.
    - **claude_code**: Format as a structured markdown prompt with clear
      sections (## What this builds, ## Step 1..N, ## What NOT to do,
      ## How to verify). Include explicit file structure expectations.
      Match the style of the Claude Code Prompts in the project's
      planning docs.
    - **cursor**: Format as a composer-ready markdown prompt with
      Context, Requirements, Constraints, and References sections.
    - **lovable**: Format as a natural language Agent Mode prompt
      describing the application, its features, user flows, and
      technical requirements conversationally. No bullet lists or
      headers — narrative prose.

  expected_output: >
    A CodingPromptOutput JSON object. acceptance_criteria in feature_specs
    match the BRD verbatim. formatted_spec is populated with the complete
    tool-specific output for the requested target_tool. out_of_scope
    explicitly lists P2 items and constraint-driven exclusions.

  agent: brd_agent
  human_input: true
  context:
    - generate_brd_chained

# ---------- Split BRD tasks ----------
# Three tasks replace the monolithic BRD generation to avoid Bedrock
# read timeouts. Each task stays under 16K output tokens.

brd_structure_task:
  description: >
    Read the approved PRFAQ and research brief, then produce the core
    BRD structure: executive summary, problem statement, solution
    overview (with Mermaid diagram), user stories, functional
    requirements with acceptance criteria and code samples,
    non-functional requirements, and technical context.

    Do NOT produce cost flags, risks, success metrics, or timeline.
    Those will be handled in a separate follow-up task.

    ## Inputs

    **Approved PRFAQ file path:** {prfaq_path}
    **Research brief file path:** {research_path}
    **Design brief file path:** {design_brief_path}
    **Known Constraints:** {known_constraints}
    **Business Context:** {business_context}

    ## Process

    1. Load the style guide via style_guide_loader.
    2. Read the PRFAQ from {prfaq_path} using file_reader.
    3. If {research_path} is non-empty, read it for market and
       customer evidence. Reference competitors by name.
    4. If {design_brief_path} is non-empty, read it and reference
       screen names in user stories.
    5. Apply the AWS-first rule for all architecture references.
    6. Every functional requirement must reference at least one user
       story ID. Every user story must reference a PRFAQ section.
    7. Include code samples (API contracts, schemas, Mermaid diagrams)
       in functional requirements.

    If the builder_mcp tool is available, use it to search internal wiki
    pages and code repositories for technical prior art and architecture
    decisions related to {known_constraints}. Include relevant findings
    in the technical context section. If the outlook_mcp tool is
    available, use it to look up stakeholder availability for the
    timeline. If either tool is not available or returns an error,
    continue with the inputs already provided.

    ## Output

    Return a BRDStructureOutput JSON. Do NOT include cost_flags,
    risks, success_metrics, timeline_and_milestones, or
    version_history fields.

  expected_output: >
    A BRDStructureOutput JSON with executive_summary, problem_statement,
    proposed_solution_overview (with Mermaid diagram), user_stories (3+),
    functional_requirements (3+ with acceptance criteria and code samples),
    non_functional_requirements (2+), and technical_context_and_dependencies.

  agent: brd_agent
  human_input: false

brd_cost_risk_task:
  description: >
    Produce the cost flags, risks, success metrics, timeline, and
    version history for a BRD. This task runs in PARALLEL with the
    structure task, so you do NOT have access to structure's output.

    Use Tavily and the AWS pricing lookup tool to find real pricing
    data for cost-flagged decisions. Include specific per-unit prices.

    ## Inputs

    **Approved PRFAQ file path:** {prfaq_path}
    **Research brief file path:** {research_path}
    **Known Constraints:** {known_constraints}
    **Business Context:** {business_context}
    **Success Metrics:** {success_metrics}
    **Timing:** {timing}

    ## Process

    1. Read the PRFAQ from {prfaq_path} using file_reader. Focus on:
       - The solution overview and external FAQs for architectural
         decisions that matter for cost (e.g., real-time requirements,
         multi-region, storage footprint, LLM inference volume).
       - The appendix_gaps for risks the PRFAQ has already surfaced.
    2. If {research_path} is non-empty, read it with file_reader.
       Focus on gaps_and_limitations for additional risks, and on
       competitive analysis for architectural complexity signals.
    3. For each architectural decision with cost implications, use
       aws_pricing_lookup or tavily_search to find real pricing.
       Use product_family to narrow results for large services.
    4. Produce cost flags with decision, why_it_matters, tradeoff,
       reference_url, and pricing_data (raw pricing summary from
       the pricing tool).
    5. Produce risks (2+) sourced from:
       - PRFAQ appendix_gaps
       - Research gaps_and_limitations
       - Technical complexity signals in the PRFAQ solution overview
         (e.g., third-party integrations, strict latency targets,
         multi-region requirements)
       - PM known_constraints that create implementation risk
       Each risk: description, likelihood (high/medium/low), impact,
       mitigation.
    6. Produce success metrics (1+) using business_context as baseline
       values and success_metrics as targets. Each metric: metric name,
       target_value, measurement_method, timeline.
    7. Produce timeline_and_milestones from the timing input.
    8. Add version_history with v1.0, today's date, author "Agent 4".

    ## Output

    Return a BRDCostRiskOutput JSON with cost_flags, risks (2+),
    success_metrics (1+), timeline_and_milestones, and
    version_history (1+).

  expected_output: >
    A BRDCostRiskOutput JSON with cost_flags containing real pricing
    data, risks (2+) sourced from PRFAQ gaps and known_constraints,
    success_metrics (1+) with baseline and target values,
    timeline_and_milestones, and version_history starting at v1.0.

  agent: brd_cost_risk_agent
  human_input: false

brd_compliance_task:
  description: >
    Produce the compliance intermediate for a BRD. This task runs in
    PARALLEL with the structure task and the cost-risk task, so you
    do NOT have access to their outputs. Do not write BRD prose, user
    stories, or functional requirements. Return a typed
    BRDComplianceOutput only.

    ## Inputs

    **Feature / Idea Summary:** {feature_summary}

    **Goals:** {goals}

    **User Summary:** {user_summary}

    **Known Constraints:** {known_constraints}

    **Business Context:** {business_context}

    **Approved PRFAQ file path:** {prfaq_path}

    **Research brief file path (may be empty):** {research_path}

    ## Process

    1. **Read the PRFAQ.** Use the file_reader tool to load
       {prfaq_path}. Focus on the data handling section and the
       appendix_gaps.

    2. **Read the research brief.** If {research_path} is non-empty,
       load it via file_reader. Focus on gaps_and_limitations for
       additional compliance-relevant signals.

    3. **Enumerate data elements.** List each data element the
       product will collect, process, store, or transmit. Ground every
       element in the PRFAQ data handling section or the PM input. Do
       not fabricate.

    4. **Classify each element.** Assign each element one
       Data_Classification value from the constrained set of five.
       Use the values verbatim:
         - Public. Information intended for public availability with
           no restriction on disclosure.
         - Confidential. General non-public information that requires
           access control but has limited harm potential if disclosed.
         - Highly Confidential. Non-public information whose disclosure
           would cause notable harm to customers or the business.
         - Restricted. Information whose disclosure would cause severe
           harm or trigger regulatory or contractual exposure.
         - Critical. Information whose disclosure or loss would cause
           the highest severity impact, including legal, financial, or
           safety consequences.

    5. **Derive Dataset_Classification** as the highest element value,
       using the order:
       Public < Confidential < Highly Confidential < Restricted < Critical.
       When data_elements is empty (gap case), set
       dataset_classification to None.

    6. **Detect vendor risk scenarios.** Evaluate the PRFAQ and PM
       input against the seven generic categories below and record
       which apply. Use these names verbatim in
       vendor_scenarios_applied:
         1. Data sharing. The product sends customer or internal data
            to a third party, or receives such data from one.
         2. Data handling. A third party stores, processes, or
            transmits customer or internal data on our behalf.
         3. Content hosting. A third party hosts user-generated or
            product-generated content visible to customers.
         4. Product development. A third party contributes to building
            or extending the product, including code, models, or
            components.
         5. Environment connection. A third-party system connects to
            our production or non-production environments.
         6. SaaS usage. The product depends on a third-party SaaS
            offering as a required runtime component.
         7. Endorsement or referral. The product is promoted to, or
            promotes, a third-party audience through contractual means.

    7. **Produce vendor considerations.** If at least one scenario
       applies, name contract review, security review expectations,
       and data sharing boundaries in generic language. If no scenario
       applies, state explicitly that no third party is involved.

    8. **Produce privacy considerations.** Ground privacy risks in the
       classifications from step 4. Propose mitigations covering:
         - Encryption in transit (TLS 1.2 or higher).
         - Encryption at rest via KMS-managed keys for payloads in
           S3 and DynamoDB.
         - Access controls enforced at API Gateway with Cognito-issued
           tokens.
         - Data minimization: only fields listed in the data handling
           table are transmitted.
         - Retention limits scoped to the operational window.
       Set design_review_flag to True when any element at Confidential
       or higher represents personal data.

    9. **List compliance gates.** Include only gates that apply, drawn
       from the constrained set of four:
         - security review
         - privacy review
         - legal or contract review
         - procurement review
       For EVERY gate included, set ComplianceGate.note to the verbatim
       string: "start early, run in parallel, do not launch with open Critical or High findings".
       Do not describe the gates as a sequential chain. Assign each gate
       an owner from the Gate_Owner enum (see step 10).

    10. **Produce the launch readiness checklist.** A table with four
        columns: Item, Applies To, Gate Owner, Evidence Reference.
        Gate Owner values are restricted to the six-value enum:
          - PM
          - Tech Lead
          - Engineer
          - Legal
          - Security
          - Privacy
        Include at minimum these six items:
          - Data classification sign-off. Applies To: all data
            elements. Gate Owner: PM. Evidence Reference: BRD data
            handling section.
          - Privacy mitigation sign-off. Applies To: elements at
            Confidential and above. Gate Owner: Privacy. Evidence
            Reference: BRD privacy considerations section.
          - Security review status. Applies To: architecture and
            integrations. Gate Owner: Security. Evidence Reference:
            BRD technical context section.
          - Monitoring or alarm setup. Applies To: production workload.
            Gate Owner: Engineer. Evidence Reference: BRD non-functional
            requirements. Use CloudWatch metrics and alarms.
          - Runbook availability. Applies To: operational procedures.
            Gate Owner: Tech Lead. Evidence Reference: runbook pointer
            or empty.
          - Rollback plan. Applies To: deployment scope. Gate Owner:
            Tech Lead. Evidence Reference: BRD timeline section.
        You may append additional rows when PRFAQ content implies
        them, for example a procurement review row when SaaS usage
        applies. Point Evidence Reference at a BRD section or PRFAQ
        reference. Leave Evidence Reference empty when no evidence is
        yet available rather than fabricating a link.

    11. **Produce post-launch maintenance.** State the recertification
        cadence for vendor access and data classifications in generic
        framing. List triggers that require classification update:
        addition of new data elements, change in data sources, change
        in vendor scope. Reference the Launch Readiness Checklist rows
        for runbook and ownership pointers.

    12. **Handle gaps.** If the PRFAQ data handling section is missing
        or empty, set data_handling_gap_flag to True, record a
        descriptive entry in data_handling_gaps (for example "PRFAQ
        did not include a data handling section"), leave data_elements
        empty, leave dataset_classification as None, and do NOT
        fabricate data elements. If the PM input file referenced by
        the file_reader tool is missing, apply the same behavior and
        record an entry naming the missing file. If the Tavily API
        key is unset and a regulation lookup is needed, record the
        attempted lookup as a gap and continue.

    13. **Return as a BRDComplianceOutput JSON.**

    ## Rules

    - No em dashes as punctuation. Restructure the sentence.
    - No contrast hooks such as "It's not X, it's Y".
    - No rhetorical questions as section openers.
    - No throat-clearing transitions.
    - No hyperbole. Banned words: "robust", "comprehensive", "powerful",
      "cutting-edge", "transformative", "game-changing", "revolutionary",
      "best-in-class", "seamless", "incredibly", "significantly",
      "essentially", "very", "really", "quite", "extremely", "strong",
      "leverage", "synergies", "drive alignment", "holistic", "unlock",
      "supercharge".
    - AWS-first defaults for all technical references (Lambda, DynamoDB,
      Cognito, API Gateway, S3, CloudFront, KMS, CloudWatch). Do not
      reference Supabase, Firebase, Vercel, or other non-enterprise
      services unless {known_constraints} explicitly requires them.
    - "The system shall..." phrasing for any requirement-style statement.
    - Zero organization-internal portal names, policy numbers, service
      brands, or domain references anywhere in the output.
    - No fabrication of data elements, vendor scenarios, compliance
      gates, or checklist items.

    ## Environment handling

    - If the DOVETAIL_API_TOKEN environment variable is unset, this
      task is unaffected. It does not call Dovetail.
    - If the Tavily API key is unset, proceed using only the PRFAQ
      and PM input. Record any attempted regulation lookups as gaps
      in data_handling_gaps and continue.

  expected_output: >
    A BRDComplianceOutput JSON with data elements classified, dataset
    classification derived, vendor considerations, privacy risks with
    mitigations, applicable compliance gates with the start-early note,
    launch readiness checklist with the minimum required items, and
    post-launch maintenance section. Gap flag set when upstream input
    is missing or insufficient, with no fabricated data elements.

  agent: brd_compliance_agent
  human_input: false

brd_assembly_task:
  description: >
    You have three completed outputs from prior tasks, all produced in
    parallel:
    1. BRDStructureOutput (from brd_structure_task): executive_summary,
       problem_statement, proposed_solution_overview, user_stories,
       functional_requirements, non_functional_requirements, and
       technical_context_and_dependencies.
    2. BRDCostRiskOutput (from brd_cost_risk_task): cost_flags, risks,
       success_metrics, timeline_and_milestones, and version_history.
    3. BRDComplianceOutput (from brd_compliance_task): data_elements,
       dataset_classification, vendor_considerations,
       vendor_scenarios_applied, privacy_considerations,
       compliance_gates, launch_readiness_checklist,
       post_launch_maintenance, data_handling_gap_flag, and
       data_handling_gaps.

    Merge all three into a single BRDOutput. You have NO tools. Do not
    search for anything new. Work only from the three prior task
    outputs.

    Copy all fields directly. Do not modify acceptance criteria,
    code samples, pricing data, data classifications, gate owners, or
    checklist items. Preserve everything verbatim. Do not paraphrase,
    reword, or reorder items inside any list.

    ## Three-way merge

    - Copy every BRDStructureOutput field into the matching BRDOutput
      field as before.
    - Copy every BRDCostRiskOutput field into the matching BRDOutput
      field as before.
    - Copy every BRDComplianceOutput field into the extended BRDOutput
      fields using the mapping below. Every value is carried over
      byte-identically.

    ## Compliance field mapping (verbatim copy)

    - BRDComplianceOutput.data_elements
        -> BRDOutput.data_handling_section.elements
    - BRDComplianceOutput.dataset_classification
        -> BRDOutput.data_handling_section.dataset_classification
    - BRDComplianceOutput.data_handling_gap_flag
        -> BRDOutput.data_handling_section.gap_flag
    - BRDComplianceOutput.data_handling_gaps
        -> BRDOutput.data_handling_section.gap_notes
    - BRDComplianceOutput.vendor_considerations
        -> BRDOutput.vendor_considerations
    - BRDComplianceOutput.vendor_scenarios_applied
        -> BRDOutput.vendor_scenarios_applied
    - BRDComplianceOutput.privacy_considerations
        -> BRDOutput.privacy_considerations
    - BRDComplianceOutput.compliance_gates
        -> BRDOutput.compliance_gates
    - BRDComplianceOutput.launch_readiness_checklist
        -> BRDOutput.launch_readiness_checklist
    - BRDComplianceOutput.post_launch_maintenance
        -> BRDOutput.post_launch_maintenance

    The dataset_classification value on the assembled
    data_handling_section must match the compliance intermediate
    exactly. When the intermediate reports it as None (gap case), it
    stays None on the assembled output. Do not infer, re-derive, or
    fill in a default.

    ## Error behavior

    If any one of the three intermediates is missing or fails
    validation, raise an assembly error that names the missing or
    invalid intermediate (BRDStructureOutput, BRDCostRiskOutput, or
    BRDComplianceOutput). Do not emit a partial BRDOutput under any
    condition. The CrewAI task-failure surface will carry the error
    up to the operator.

    ## Output

    Return a BRDOutput JSON with every section populated by merging
    the three prior outputs per the mapping above. No new content is
    generated.

  expected_output: >
    A BRDOutput JSON with all fields populated from the three prior
    task outputs (BRDStructureOutput, BRDCostRiskOutput, and
    BRDComplianceOutput) per the compliance field mapping. No new
    content generated. On a missing or invalid intermediate, the task
    raises an assembly error naming the intermediate and emits no
    partial output.

  agent: brd_agent
  human_input: true

generate_brd_standalone:
  description: >
    Produce a complete BRD v1.0 from an approved PRFAQ and research brief
    that already exist on disk. Read both files via the file_reader tool.

    ## Inputs

    **Approved PRFAQ file path:** {prfaq_path}

    **Research brief file path (may be empty if unavailable):** {research_path}

    ## Process

    1. **Load the style guide** via style_guide_loader before drafting
       the prose sections.

    2. **Read the PRFAQ from {prfaq_path}** using the file_reader tool.
       This is the primary source of truth.

    3. **If {research_path} is non-empty, read it as well** for the
       underlying market and customer evidence.

    3a. **Use the competitive analysis from the research brief.** Read
       the competitive analysis section of the research brief. Reference
       each named competitor by name in the solution rationale section.
       Identify at least one point of differentiation for each named
       competitor: something we do that they do not, or something they
       do that we must match. In the proposed solution overview and
       problem statement sections, cite each competitor by name rather
       than referring to "competitors" generically.

    4. **Apply the AWS-first rule.** All architecture references default
       to AWS services (Lambda, DynamoDB, Cognito, API Gateway, S3,
       CloudFront, SNS/SQS/EventBridge, Bedrock). Do not reference
       Supabase, Firebase, Vercel, or other non-enterprise services
       unless the PM's constraints explicitly require them.

    5. **Use Tavily and AWS Pricing API** for cost-flagged decisions.
       Use the aws_pricing_lookup tool to get exact current pricing for
       each AWS service involved in the decision. Include specific
       per-unit prices in the cost flag. Store the raw pricing summary
       in the pricing_data field. When looking up pricing, use the
       product_family parameter to narrow results for large services
       (e.g., product_family="Serverless" for Lambda on-demand,
       product_family="Compute Instance" for EC2). If aws_pricing_lookup
       fails, fall back to tavily_search and note that pricing should
       be verified on the AWS pricing page.

    6. **Honor gaps.** If the PRFAQ surfaces open gaps or risks,
       carry them into the BRD risk section.

    7. **Use business context.** If business_context was provided in the
       original input, reference it in the Success Metrics section as
       baseline values. Each success metric should show: current state
       (from business_context) → target state (from Success Metrics input)
       → measurement method. This makes the BRD's success criteria
       measurable against a real starting point.

    8. **Enforce traceability.** Every functional requirement must
       reference at least one user story ID. Every user story must
       reference a research finding or PRFAQ section in its source field.

    8a. **Design brief handling (conditional).** If {design_brief_path}
       is non-empty, use file_reader to read the design brief. Then:
       1. Reference specific screens by name when writing user stories
          (e.g., "As a user on the Dashboard screen, I want to...").
       2. Validate that your user stories cover every flow step listed
          in the design brief's user flows — every flow step should map
          to at least one user story.
       3. Carry screen names into the BRD's functional requirement
          descriptions for consistency with the design.
       4. Reference design principles from the brief in your solution
          rationale where relevant.
       If {design_brief_path} is empty, proceed without design context
       and do not reference screen names or flows.

    9. **Return as a JSON object matching the BRDOutput schema.**

    If the builder_mcp tool is available, use it to search internal wiki
    pages and code repositories for technical prior art and architecture
    context. Include relevant findings in the technical context section.
    If the outlook_mcp tool is available, use it to look up stakeholder
    availability and factor it into the Timeline and Milestones section.
    If either tool is not available or returns an error, continue with
    the inputs already provided.

    ## BRD Structure (12 sections)

    1. **Executive summary** — 3-5 sentences.
    2. **Problem statement** — what's broken, who it affects, evidence.
    3. **Proposed solution overview** — MUST include a Mermaid architecture
       diagram inline. The diagram should have 5-15 nodes. If the system
       is more complex, use a high-level diagram here and add a detailed
       breakdown in the technical context section.
    4. **User stories** — minimum 3, with ID, persona, action, outcome,
       priority (P0/P1/P2), source.
    5. **Functional requirements** — minimum 3, "The system shall...",
       given/when/then acceptance criteria, related user story IDs,
       and code samples (API contracts, schemas) where useful.
    6. **Non-functional requirements** — minimum 2, quantified targets only.
    7. **Technical context and dependencies** — MUST include a Mermaid
       diagram of the existing system. Keep it to 5-15 nodes showing the
       major components and their relationships.
    8. **Cost flags** — decision, why_it_matters, tradeoff, reference_url.
    9. **Risks** — minimum 2.
    10. **Success metrics** — minimum 1.
    11. **Timeline and milestones**.
    12. **Version history** — start with v1.0, today's date, author "Agent 4".

    ## Customer Requirements Handling (when requirements file is provided)

    If the PM provides a customer requirements file via --requirements-path
    (passed as {requirements_path}), use the requirements_reader tool to
    parse it. These pre-existing requirements represent what the PM has
    already gathered from customers, interviews, or an existing backlog.

    Your job is to RECONCILE these requirements with the PRFAQ, not blindly
    include them:

    1. KEEP requirements that align with the approved PRFAQ. Carry forward
       the PM's exact title and description wording. Preserve their priority
       (P0-P4). Assign a user story ID (US-xxx) or functional requirement
       ID (FR-xxx) as appropriate.

    2. FLAG requirements that contradict the PRFAQ or have no traceability
       to the research. Present these to the PM during human review with a
       clear note: "[CR-xxx] does not appear in the approved PRFAQ or
       research output. Recommend confirming with stakeholders before
       including in the BRD."

    3. FILL GAPS — identify requirements implied by the PRFAQ customer
       experience narrative or internal FAQ answers that the PM's
       requirements file does not cover. Generate these as new requirements,
       clearly marked with origin: "agent-generated" and traceability: "PRFAQ section X"
       so the PM can distinguish them from their own inputs.

    4. DO NOT override the PM's priority assignments. If a PM marked
       something P0, it stays P0 even if the research suggests it's less
       critical. The PM owns prioritization. If you disagree, note it in
       the requirement's rationale field but do not change the priority.

    5. In the BRD output, every user story and functional requirement should
       have an `origin` field indicating whether it came from
       "customer_input" (the PM's file), "agent-generated" (derived from
       PRFAQ/research), or "reconciled" (PM's requirement that was modified
       to align with PRFAQ). Use the `traceability` field to reference the
       specific PRFAQ section, research finding, or PM constraint (e.g.
       "PRFAQ FAQ #3", "CR-005 (PM input)").

    If NO requirements file is provided (requirements_path is empty),
    generate all user stories and functional requirements from the PRFAQ
    and research as you do today. This feature is purely additive.

  expected_output: >
    A BRDOutput JSON object with all required fields populated. Same
    quality bar as the chained version. Version history starts at 1.0.
    If a requirements file was provided, user stories and functional
    requirements include source fields indicating origin (customer_input,
    agent-generated, or reconciled).

  agent: brd_agent
  human_input: true

# ---------- Split build spec tasks ----------
# These two tasks replace the monolithic build spec task to avoid
# Bedrock read timeouts on large outputs. Task 1 produces the
# structure (all fields except formatted_spec). Task 2 produces
# only the formatted_spec from the structure via context.

build_spec_structure_standalone:
  description: >
    Produce the structure of a build spec from an approved BRD on disk.
    Do NOT generate the formatted_spec field. That will be done in a
    separate follow-up task.

    ## Inputs

    **Approved BRD file path:** {brd_path}

    **Target tool:** {target_tool}

    ## Process

    1. **Load the style guide** via style_guide_loader for any prose.
    2. **Read the BRD** from {brd_path} using file_reader.
    3. **Carry acceptance criteria forward EXACTLY** from the BRD.
    4. **Carry forward code samples** from the BRD.
    5. **Identify out-of-scope items.**

    ## Output

    Return a BuildSpecStructureOutput JSON with: build_summary,
    user_flows, feature_specs, technical_constraints,
    architecture_reference, current_state_context, out_of_scope,
    and target_tool. Do NOT include a formatted_spec field.

  expected_output: >
    A BuildSpecStructureOutput JSON object with all fields populated
    except formatted_spec. acceptance_criteria in feature_specs match
    the BRD verbatim.

  agent: brd_agent
  human_input: false

format_spec_standalone:
  description: >
    You have a completed BuildSpecStructureOutput from the prior task.
    Your only job is to reformat it into the tool-specific
    formatted_spec string. You have NO tools. Do not search for
    anything new. Work only from the prior task output.

    ## Inputs

    **Target tool:** {target_tool}

    ## Formatting rules

    - **kiro**: Format as a Kiro-compatible spec with three sections:
      Requirements (use EARS notation if natural), Design (architecture,
      data models, sequence diagrams), and Tasks (implementation steps).
    - **claude_code**: Structured markdown prompt with ## What this
      builds, ## Step 1..N, ## What NOT to do, ## How to verify.
    - **cursor**: Composer-ready markdown with Context, Requirements,
      Constraints, and References sections.
    - **lovable**: Natural language Agent Mode prompt, narrative prose.

    ## Output

    Return a FormattedSpecOutput JSON with two fields: formatted_spec
    (the complete tool-ready string) and target_tool.

  expected_output: >
    A FormattedSpecOutput JSON object with formatted_spec populated
    as the complete tool-specific output for the requested target_tool.

  agent: brd_agent
  human_input: true

generate_build_spec_standalone:
  description: >
    Produce a build spec from an approved BRD that already exists on disk.
    Read the BRD file via the file_reader tool.

    ## Inputs

    **Approved BRD file path:** {brd_path}

    **Target tool:** {target_tool}

    Valid target tools: kiro, claude_code, cursor, lovable.

    ## Process

    1. **Load the style guide** via style_guide_loader for any prose.
    2. **Read the BRD from {brd_path}** using file_reader. This is the
       source of truth for requirements, code samples, and architecture.
    3. **Carry acceptance criteria forward EXACTLY.** Do not paraphrase,
       summarize, or reword them. Copy them character-for-character from
       the BRD's functional requirements into the feature_specs.
    4. **Carry forward code samples** from the BRD as implementation
       guidance.
    5. **Identify out-of-scope items.** P2 items from the BRD and
       constraint-driven exclusions. The coding tool MUST NOT build these.
    6. **Format the formatted_spec field** for the chosen target tool.

    ## Build Spec Structure

    1. **build_summary** — 2-3 sentences: what to build, for whom, done condition.
    2. **user_flows** — minimum 1.
    3. **feature_specs** — minimum 1, acceptance_criteria EXACT from BRD.
    4. **technical_constraints** — AWS-specific.
    5. **architecture_reference** — Mermaid diagram + description from BRD.
    6. **current_state_context** — relevant excerpts from BRD's technical context.
    7. **out_of_scope** — explicit list.
    8. **target_tool** — the chosen tool name.
    9. **formatted_spec** — the complete tool-ready output.

    ## Tool-specific formatting rules for formatted_spec

    - **kiro**: Requirements (EARS notation), Design, Tasks sections.
    - **claude_code**: Structured markdown prompt with ## What this builds,
      ## Step 1..N, ## What NOT to do, ## How to verify sections.
    - **cursor**: Composer-ready markdown with Context, Requirements,
      Constraints, References sections.
    - **lovable**: Natural language Agent Mode prompt, narrative prose only.

  expected_output: >
    A CodingPromptOutput JSON object. acceptance_criteria match the BRD
    verbatim. formatted_spec populated for the requested target_tool.

  agent: brd_agent
  human_input: true


# ---------- Feedback classifier ----------
# Wave 2 Day 1: classifier for the stakeholder feedback loop.
# Runs once per feedback item (one LLM call per item, per the decision
# in 2026-04-24_wave2_design_classifier_and_apply.md).

feedback_classify_task:
  description: >
    Classify a single stakeholder feedback item by the artifacts and
    sections it affects, surface contradictions with existing artifact
    content or with other feedback items, and flag research gaps that
    one of the three research tools (Tavily, CompetitiveIntel, Dovetail)
    could fill.

    You do NOT revise content. You only classify.

    ## Inputs

    **Feedback item ID:** {feedback_id}

    **Feedback source:** {feedback_source}

    **Feedback body:**
    ```
    {feedback_body}
    ```

    **Current artifact summaries** (empty means the artifact does not
    yet exist on disk):

    ### research_brief summary:
    ```
    {research_brief_summary}
    ```

    ### prfaq summary:
    ```
    {prfaq_summary}
    ```

    ### design_brief summary:
    ```
    {design_brief_summary}
    ```

    ### brd summary:
    ```
    {brd_summary}
    ```

    ### build_spec summary:
    ```
    {build_spec_summary}
    ```

    **Other open feedback items** (id, source, summary):
    ```
    {other_feedback_summaries}
    ```

    ## Process

    1. Read the feedback body. Identify the topic in one phrase.
    2. For each artifact that currently exists, decide whether the
       feedback's topic affects content in that artifact. If yes, name
       the specific sections (from the schema in your backstory). If no,
       omit the artifact from the affects list.
    3. Check whether the feedback contradicts any claim in the current
       artifact summaries. Flag only unambiguous contradictions. If in
       doubt, do NOT flag.
    4. Check whether the feedback contradicts any other open feedback
       item's stated position. Flag only unambiguous contradictions.
    5. Check whether the feedback asks for data that tavily,
       competitive_intel, or dovetail could fetch. If yes, name the tool
       and write a scoped query string for the research supplement.
    6. Return a FeedbackClassification JSON with the affects,
       research_gaps, contradictions, and classifier_notes fields.

    ## Rules

    - Only name sections that exist in the artifact schema in your
      backstory. Made-up section names are invalid.
    - Confidence on each ArtifactImpact is 0.0 to 1.0. Below 0.5 means
      do not flag; omit the artifact entirely.
    - Empty artifact summaries mean that artifact does not exist yet.
      Do not include empty-summary artifacts in the affects list.
    - Return ONLY the FeedbackClassification JSON. No preamble, no
      trailing commentary. Use classifier_notes for any caveats.

  expected_output: >
    A FeedbackClassification JSON with:
    - affects: list of ArtifactImpact (may be empty)
    - research_gaps: list of ResearchGap (may be empty)
    - contradictions: list of ContradictionFlag (may be empty)
    - classifier_notes: optional free-form notes

  agent: feedback_classifier_agent
  human_input: false
